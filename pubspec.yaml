name: taller_mecanico_frontend
description: "Interfaz Flutter (web y Android) para la API de historial de un taller mecanico."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  intl: ^0.20.3
  go_router: ^17.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod: ^3.3.2

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Inter-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fuentes/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fuentes/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fuentes/JetBrainsMono-Bold.ttf
          weight: 700
