name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # base-href tiene que coincidir con el nombre del repositorio: GitHub Pages
      # publica el sitio en un subdirectorio, no en la raiz del dominio.
      - run: flutter build web --release --base-href /ParqueInyeccion3.3/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
